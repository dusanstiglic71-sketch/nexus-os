<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXOS OS | Cenovnik</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0b0f; color: #00ffcc; font-family: sans-serif; padding: 30px; }
        h1, h2 { text-align: center; margin-bottom: 20px; }
        .grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .box { background: #121216; border: 2px solid #00ffcc; padding: 25px; border-radius: 12px; width: 280px; text-align: center; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        .price { font-size: 2rem; font-weight: bold; color: #fff; margin: 15px 0; }
    </style>
</head>
<body>

    <h1>NEXUS OS - USLUGE I CENE</h1>
    <h2>Izaberi svoj paket</h2>

    <div class="grid">
        <div class="box">
            <h3>Osnovni Paket</h3>
            <div class="price">29€</div>
            <p>Osnovna stranica, git setup i stabilna veza.</p>
        </div>
        <div class="box" style="border-color: #ff007f;">
            <h3>Pro Sistem</h3>
            <div class="price" style="color: #ff007f;">69€</div>
            <p>Ceo interfejs, kartice, dizajn i AI bot.</p>
        </div>
        <div class="box">
            <h3>Enterprise</h3>
            <div class="price">149€</div>
            <p>Napredne skripte, baze i VIP podrška.</p>
        </div>
    </div>

    <!-- AI CHAT WIDGET -->
    <div id="nexus-chat-container" style="position: fixed; bottom: 25px; right: 25px; z-index: 99999;">
        <div id="nexus-chat-box" style="display: none; width: 320px; height: 400px; background: #121216; color: #fff; border: 2px solid #00ffcc; border-radius: 12px; flex-direction: column; overflow: hidden;">
            <div style="background: #1a1a24; padding: 10px; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: bold; color: #00ffcc;">🤖 NEXUS AI</span>
                <button onclick="toggleChat()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">&times;</button>
            </div>
            <div id="nexus-chat-messages" style="flex: 1; padding: 10px; overflow-y: auto; font-size: 14px;">
                <div style="background: #1a1a24; padding: 8px; border-radius: 6px;">Tu su cene, majstore! Kako ide?</div>
            </div>
            <div style="padding: 10px; background: #1a1a24; display: flex; gap: 5px;">
                <input type="text" id="nexus-chat-input" placeholder="Poruka..." style="flex:1; background:#0b0b0f; border:1px solid #333; color:#fff; padding:6px; border-radius:4px; outline:none;">
                <button onclick="posaljiPoruku()" style="background:#00ffcc; border:none; padding:6px 12px; font-weight:bold; cursor:pointer;">Pošalji</button>
            </div>
        </div>
        <button id="nexus-chat-toggle" onclick="toggleChat()" style="background: #00ffcc; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 26px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,204,0.4);">💬</button>
    </div>

    <script>
    function toggleChat() {
        const box = document.getElementById('nexus-chat-box');
        const btn = document.getElementById('nexus-chat-toggle');
        if (box.style.display === 'none' || box.style.display === '') {
            box.style.display = 'flex';
            btn.style.display = 'none';
        } else {
            box.style.display = 'none';
            btn.style.display = 'flex';
        }
    }
    function posaljiPoruku() {
        const input = document.getElementById('nexus-chat-input');
        if (!input.value.trim()) return;
        const msgs = document.getElementById('nexus-chat-messages');
        msgs.innerHTML += `<div style="background: #005f56; padding: 6px; border-radius: 4px; margin-top:5px;">${input.value}</div>`;
        input.value = '';
    }
    </script>
</body>
</html>

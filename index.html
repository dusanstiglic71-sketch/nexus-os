<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS OS | Centralni Sistem</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .nexus-container {
            text-align: center;
            border: 2px solid #00ffcc;
            padding: 50px;
            border-radius: 16px;
            background: rgba(12, 12, 18, 0.95);
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.25);
            max-width: 600px;
            width: 90%;
        }
        h1 { font-size: 3.5rem; margin-bottom: 10px; text-shadow: 0 0 15px rgba(0,255,204,0.6); letter-spacing: 2px; }
        p { color: #8a8a9e; font-size: 1.1rem; margin-bottom: 25px; }
        .status-badge {
            display: inline-block;
            background: rgba(0, 95, 86, 0.5);
            color: #00ffcc;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 10px rgba(0,255,204,0.2);
        }
    </style>
</head>
<body>

    <div class="nexus-container">
        <h1>NEXUS OS</h1>
        <p>Autonomni Operativni Sistem & Veštačka Inteligencija</p>
        <div class="status-badge">⚡ STATUS: ONLINE &bull; LIVE NA MREŽI</div>
    </div>

    <!-- AI CHAT WIDGET -->
    <div id="nexus-chat-container" style="position: fixed; bottom: 25px; right: 25px; z-index: 99999; font-family: 'Segoe UI', sans-serif;">
        <div id="nexus-chat-box" style="display: none; width: 340px; height: 450px; background: #0c0c12; color: #fff; border: 2px solid #00ffcc; border-radius: 14px; flex-direction: column; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.8);">
            <div style="background: #14141f; padding: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222233;">
                <span style="font-weight: bold; color: #00ffcc; font-size: 15px;">🤖 NEXUS AI Core</span>
                <button onclick="toggleChat()" style="background: none; border: none; color: #fff; cursor: pointer; font-size: 20px; font-weight: bold;">&times;</button>
            </div>
            <div id="nexus-chat-messages" style="flex: 1; padding: 14px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 10px; background: #08080c;">
                <div style="background: #141420; color: #00ffcc; padding: 10px 14px; border-radius: 8px; align-self: flex-start; border-left: 3px solid #00ffcc; max-width: 85%;">
                    Pozdrav! Ja sam NEXUS AI. Sistem je spreman i sve komponente rade savršeno.
                </div>
            </div>
            <div style="padding: 12px; background: #14141f; display: flex; gap: 8px; border-top: 1px solid #222233;">
                <input type="text" id="nexus-chat-input" placeholder="Unesi komandu ili poruku..." style="flex: 1; background: #050508; border: 1px solid #33334d; color: #fff; padding: 10px; border-radius: 8px; outline: none; font-size: 14px;" onkeypress="if(event.key === 'Enter') posaljiPoruku();">
                <button onclick="posaljiPoruku()" style="background: #00ffcc; color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">Pošalji</button>
            </div>
        </div>
        <button id="nexus-chat-toggle" onclick="toggleChat()" style="background: #00ffcc; color: #000; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 28px; cursor: pointer; box-shadow: 0 5px 20px rgba(0,255,204,0.5); display: flex; align-items: center; justify-content: center;">💬</button>
    </div>

    <script>
    function toggleChat() {
        const box = document.getElementById('nexus-chat-box');
        const btn = document.getElementById('nexus-chat-toggle');
        if (box.style.display === 'none' || box.style.display === '') {
            box.style.display = 'flex';
            btn.style.display = 'none';
        } else {
            box.style.display = 'none';
            btn.style.display = 'flex';
        }
    }

    function posaljiPoruku() {
        const input = document.getElementById('nexus-chat-input');
        const poruka = input.value.trim();
        if (!poruka) return;

        const msgs = document.getElementById('nexus-chat-messages');
        msgs.innerHTML += `<div style="background: #005f56; color: #fff; padding: 10px 14px; border-radius: 8px; align-self: flex-end; max-width: 85%;">${poruka}</div>`;
        input.value = '';
        msgs.scrollTop = msgs.scrollHeight;

        setTimeout(() => {
            let odgovor = "Komanda primljena. NEXUS OS izvršava zadatak.";
            const pL = poruka.toLowerCase();
            if (pL.includes('zdravo') || pL.includes('cao')) {
                odgovor = "Pozdrav, majstore! Sve radi besprekorno.";
            } else if (pL.includes('status')) {
                odgovor = "Status: Online, sve komponente rade.";
            }
            msgs.innerHTML += `<div style="background: #141420; color: #00ffcc; padding: 10px 14px; border-radius: 8px; align-self: flex-start; border-left: 3px solid #00ffcc; max-width: 85%;">${odgovor}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }, 500);
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS OS | Centralni Sistem</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b0f;
            color: #00ffcc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            border: 2px solid #00ffcc;
            padding: 40px;
            border-radius: 15px;
            background: rgba(18, 18, 20, 0.9);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
        }
        h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        p { color: #888; font-size: 1.1rem; margin-bottom: 20px; }
        .status-badge {
            display: inline-block;
            background: #005f56;
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NEXUS OS</h1>
        <p>Autonomni sistem i veštačka inteligencija</p>
        <div class="status-badge">STATUS: ONLINE &bull; LIVE NA MREŽI</div>
    </div>

    <!-- NEXUS OS AI CHAT WIDGET -->
    <div id="nexus-chat-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; font-family: sans-serif;">
        <div id="nexus-chat-box" style="display: none; width: 320px; height: 420px; background: #121216; color: #fff; border: 1px solid #00ffcc; border-radius: 12px; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.7);">
            <div style="background: #1a1a24; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a3a;">
                <span style="font-weight: bold; color: #00ffcc;">🤖 NEXUS AI Core</span>
                <button onclick="toggleChat()" style="background: none; border: none; color: #fff; cursor: pointer; font-size: 18px;">&times;</button>
            </div>
            <div id="nexus-chat-messages" style="flex: 1; padding: 12px; overflow-y: auto; font-size: 14px; display: flex; flex-direction: column; gap: 10px;">
                <div style="background: #1e1e28; padding: 8px 12px; border-radius: 8px; align-self: flex-start; border-left: 3px solid #00ffcc;">Zdravo! Ja sam NEXUS AI. Sistem radi savršeno!</div>
            </div>
            <div style="padding: 10px; background: #1a1a24; display: flex; gap: 6px; border-top: 1px solid #2a2a3a;">
                <input type="text" id="nexus-chat-input" placeholder="Unesi poruku..." style="flex: 1; background: #0b0b0f; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; outline: none;" onkeypress="if(event.key === 'Enter') posaljiPoruku();">
                <button onclick="posaljiPoruku()" style="background: #00ffcc; color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">Pošalji</button>
            </div>
        </div>
        <button id="nexus-chat-toggle" onclick="toggleChat()" style="background: #00ffcc; color: #000; border: none; width: 60px; height: 60px; border-radius: 50%; font-size: 26px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,255,204,0.4); display: flex; align-items: center; justify-content: center; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">💬</button>
    </div>

    <script>
    function toggleChat() {
        const box = document.getElementById('nexus-chat-box');
        const btn = document.getElementById('nexus-chat-toggle');
        if (box.style.display === 'none' || box.style.display === '') {
            box.style.display = 'flex';
            btn.style.display = 'none';
        } else {
            box.style.display = 'none';
            btn.style.display = 'flex';
        }
    }

    function posaljiPoruku() {
        const input = document.getElementById('nexus-chat-input');
        const poruka = input.value.trim();
        if (!poruka) return;

        const msgs = document.getElementById('nexus-chat-messages');
        
        // Korisnikova poruka
        msgs.innerHTML += `<div style="background: #005f56; color: #fff; padding: 8px 12px; border-radius: 8px; align-self: flex-end; max-width: 80%;">${poruka}</div>`;
        input.value = '';
        msgs.scrollTop = msgs.scrollHeight;

        // AI odgovor sa logikom
        setTimeout(() => {
            let odgovor = "Primio sam komandu, sistem je stabilan.";
            const pL = poruka.toLowerCase();
            if (pL.includes('zdravo') || pL.includes('cao')) {
                odgovor = "Pozdrav, majstore! Sve komponente NEXUS OS-a rade besprekorno.";
            } else if (pL.includes('status')) {
                odgovor = "Status: Online, GitHub Pages sinhronizovan, AI Core aktivan.";
            } else if (pL.includes('pomoć') || pL.includes('help')) {
                odgovor = "Dostupne komande u chatu: 'status', 'zdravo', ili bilo koji upit za sistem.";
            }
            
            msgs.innerHTML += `<div style="background: #1e1e28; color: #fff; padding: 8px 12px; border-radius: 8px; align-self: flex-start; max-width: 80%; border-left: 3px solid #00ffcc;">${odgovor}</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }, 500);
    }
    </script>

</body>
</html>
